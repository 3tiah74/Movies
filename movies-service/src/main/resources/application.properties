spring.application.name=movies-service
server.port=8082

spring.datasource.url=jdbc:mysql://mysql:3306/movies_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=ThisIsAVeryLongSecretKeyForLetterboxdAuthServiceJwtAuthenticationSystem123456789
jwt.expiration=86400000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
